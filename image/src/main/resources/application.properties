spring.application.name=langchain4j-image

langchain4j.anthropic.chat-model.api-key=${ANTHROPIC_API_KEY}
langchain4j.anthropic.chat-model.model-name=claude-sonnet-5-5
langchain4j.anthropic.chat-model.max-tokens=4096
langchain4j.anthropic.chat-model.log-requests=true
langchain4j.anthropic.chat-model.log-responses=true

langchain4j.open-ai.image-model.api-key=${OPENAI_API_KEY:not-set}
langchain4j.open-ai.image-model.model-name=gpt-image-1
langchain4j.open-ai.image-model.size=1024x1024
langchain4j.open-ai.image-model.quality=medium
langchain4j.open-ai.image-model.output-format=png
langchain4j.open-ai.image-model.timeout=3m
langchain4j.open-ai.image-model.log-requests=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

logging.level.dev.langchain4j=DEBUG
