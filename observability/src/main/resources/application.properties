spring.application.name=langchain4j-observability

langchain4j.anthropic.chat-model.api-key=${ANTHROPIC_API_KEY}
langchain4j.anthropic.chat-model.model-name=claude-sonnet-5-5
langchain4j.anthropic.chat-model.max-tokens=4096
langchain4j.anthropic.chat-model.log-requests=true
langchain4j.anthropic.chat-model.log-responses=true

logging.level.dev.langchain4j=DEBUG

management.endpoints.web.exposure.include=health,metrics
management.tracing.sampling.probability=1.0
# Default is 1 minute; shorter so metrics reach Grafana soon after a request
management.otlp.metrics.export.step=10s

ai.observability.retrieval-max-results=3
# Puts the question, answer, retrieval query and tool arguments/results on the spans.
# Handy while learning; it is user data, so keep it false in production.
ai.observability.include-content=true
