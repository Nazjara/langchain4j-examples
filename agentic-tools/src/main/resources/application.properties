spring.application.name=langchain4j-agentic-tools

langchain4j.anthropic.chat-model.api-key=${ANTHROPIC_API_KEY}
langchain4j.anthropic.chat-model.model-name=claude-sonnet-5-5
langchain4j.anthropic.chat-model.max-tokens=8192
langchain4j.anthropic.chat-model.cache-tools=true
langchain4j.anthropic.chat-model.log-requests=true
langchain4j.anthropic.chat-model.log-responses=true

langchain4j.anthropic.streaming-chat-model.api-key=${ANTHROPIC_API_KEY}
langchain4j.anthropic.streaming-chat-model.model-name=claude-sonnet-5-5
langchain4j.anthropic.streaming-chat-model.max-tokens=8192
langchain4j.anthropic.streaming-chat-model.cache-tools=true
langchain4j.anthropic.streaming-chat-model.log-requests=true
langchain4j.anthropic.streaming-chat-model.log-responses=true

spring.mvc.async.request-timeout=2m

ai.agentic-tools.max-tool-calling-round-trips=10
ai.agentic-tools.plan.memory-messages=100
ai.agentic-tools.plan.max-retries=3

logging.level.dev.langchain4j=DEBUG
